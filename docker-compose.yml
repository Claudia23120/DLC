# Runs only the Next.js app. The database, auth and storage are provided by
# Supabase in the cloud, so no Postgres container is needed here.
#
# For local development against a local Supabase stack instead of the cloud,
# use the Supabase CLI (`supabase start`) separately and point the env vars at
# it — see the README.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are needed at build time (inlined into the bundle).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        SITE_URL: ${SITE_URL}
    image: colla-diables:latest
    container_name: colla-diables
    ports:
      - "3005:3000"
    env_file:
      - .env.local
    restart: unless-stopped

  # Local mail inbox for testing notifications (bolo created, reminders).
  # Not started by `make start`; run: docker compose --profile mail up -d mailpit
  # Then set SMTP_HOST=mailpit (or localhost when the app runs outside Docker)
  # in .env.local and open http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: colla-diables-mailpit
    profiles: ["mail"]
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP
    restart: unless-stopped
